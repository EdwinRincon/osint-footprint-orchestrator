<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grafo de relaciones OSINT</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172b2a; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: clamp(.75rem, 2vw, 1.5rem); }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
    button { min-height: 38px; padding: .45rem .8rem; border: 1px solid #cbd8d5;
             border-radius: 7px; background: #fff; color: #24534d; font: inherit;
             font-weight: 650; cursor: pointer; }
    button:focus-visible { outline: 3px solid #72b9a9; outline-offset: 2px; }
    button:disabled { opacity: .55; cursor: wait; }
    #network { width: 100%; height: min(75vh, 900px); min-height: 420px; margin-top: .7rem;
               overflow: hidden; border: 1px solid #dce6e3; border-radius: 10px;
               background: #fbfdfc; }
    .legend { display: flex; flex-wrap: wrap; gap: .5rem 1rem; margin: .65rem 0;
              color: #536563; font-size: .85rem; }
    .legend span::before { display: inline-block; width: .75rem; height: .75rem;
                           margin-right: .35rem; border-radius: 50%; content: ""; }
    .legend .target::before { background: #17695e; }
    .legend .entity::before { background: #8cb8d8; }
    .legend .weak::before { width: 1.2rem; height: 0; border-top: 2px dashed #778581;
                            border-radius: 0; vertical-align: middle; }
    #details { min-height: 2rem; margin: .5rem 0 0; color: #536563;
               font-size: .9rem; line-height: 1.5; overflow-wrap: anywhere; }
    #export-status { min-height: 1.5rem; color: #536563; font-size: .9rem; }
    #graph-summary { margin: .7rem 0; color: #536563; font-size: .9rem; }
    .empty { display: grid; height: 100%; place-items: center; padding: 2rem;
             color: #657572; text-align: center; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="toolbar" aria-label="Controles del grafo">
      <button type="button" id="fit">Ajustar vista</button>
      <button type="button" id="layout">Reorganizar grafo</button>
      <button type="button" id="reset-groups" hidden>Restablecer agrupación</button>
      <button type="button" id="export">Descargar imagen PNG</button>
    </div>
    <div class="legend" aria-label="Leyenda">
      <span class="target">Dato de entrada</span>
      <span class="entity">Entidad observada</span>
      <span class="weak">Relación con confianza heurística baja</span>
    </div>
    <p id="graph-summary" aria-live="polite"></p>
    <div id="network" role="region" aria-label="Grafo interactivo de entidades y evidencias">
      <p class="empty">No hay relaciones para visualizar en esta búsqueda.</p>
    </div>
    <p id="details" aria-live="polite">Selecciona un nodo o una relación para consultar su evidencia.</p>
    <p id="export-status" role="status" aria-live="polite"></p>
  </main>
  <script type="application/json" id="graph-data">{{ graph_data|tojson }}</script>
  <script src="cytoscape.min.js" defer></script>
  <script src="graph.js" defer></script>
</body>
</html>
