[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-tool"
version = "0.1.0"
description = "Herramienta educativa de OSINT modular con informe, grafo y web local"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "flask>=3.0",
    "jinja2>=3.1",
    "dnspython>=2.4",
    "python-whois>=0.9",
    "phonenumbers>=8.13",
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "coverage>=7.6",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
]

# Comando `osint` disponible tras `pip install -e .`
[project.scripts]
osint = "osint_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Incluye la plantilla HTML dentro del paquete
[tool.setuptools.package-data]
osint_tool = [
    "py.typed",
    "web/templates/*.html",
    "web/static/*.js",
    "web/static/vendor/*.js",
    "web/static/vendor/*.txt",
    "reporters/templates/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: errores, I: orden de imports, B: bugs comunes, UP: sintaxis moderna,
# S: seguridad (bandit), SIM: simplificaciones; DTZ/PERF/PL/RET/RUF/T20/ARG:
# fechas, rendimiento, mantenibilidad, retornos, estilo, prints y argumentos.
select = ["E", "F", "I", "B", "UP", "S", "SIM", "DTZ", "PERF", "PL", "RET", "RUF", "T20", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # assert permitido en tests
# Test doubles intentionally leave protocol parameters unused; tests also compare literal values.
"tests/**/*.py" = ["ARG", "PLR2004"]
# CLI signatures are shaped by Typer; correlation helper arguments are kept explicit.
"src/osint_tool/cli.py" = ["PLR0913", "PLR0917"]
"src/osint_tool/correlator.py" = ["PLR0913", "PLR0917"]
# Flask's app factory groups its route registration and shared request hooks.
"src/osint_tool/web/app.py" = ["PLR0915"]
# Validation failures are intentionally isolated per candidate.
"src/osint_tool/modules/harvester.py" = ["PERF203"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
mypy_path = "src"
warn_unreachable = true
warn_unused_ignores = true
enable_error_code = ["ignore-without-code"]

[tool.coverage.run]
branch = true
source = ["osint_tool"]

# Estas librerías no incluyen tipos
[[tool.mypy.overrides]]
module = ["whois.*", "dns.*", "phonenumbers.*"]
ignore_missing_imports = true